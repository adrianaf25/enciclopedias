<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exposição Virtual</title>
  <meta name="description" content="Exposição virtual de um projeto académico." />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <section class="entry-screen" id="entry-screen" aria-label="Entrada da exposição">
    <video class="entry-video" autoplay muted loop playsinline>
      <source src="assets/videos/PÁGINA DE ENTRADA - FIM.mp4?v=2" type="video/mp4" />
    </video>
    <div class="entry-overlay"></div>
    <button class="entry-button" id="entry-button" type="button" aria-label="Entrar na exposição">
      <img src="assets/images/Ícone Entrar.png" alt="" />
    </button>
  </section>

  <div id="site-content" hidden>

    <!-- Hero -->
    <section id="home" class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>A ENCICLOPÉDIA</h1>


        <a href="sobre.html" class="btn">Iniciar a visita</a>
      </div>
      
    </section>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
