<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linha do Tempo</title>
  <meta name="description" content="Linha do tempo cronológica das enciclopédias." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/carrossel.css" />
  <link rel="stylesheet" href="css/linha-do-tempo.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">Exposição<span>.</span></a>
    <nav>
      <ul>
        <li><a href="index.html" data-pt="Início" data-en="Home">Início</a></li>
        <li><a href="sobre.html" data-pt="Sobre" data-en="About">Sobre</a></li>
        <li><a href="percursos.html" aria-current="page" data-pt="Percursos" data-en="Paths">Percursos</a></li>
        <li><a href="contacto.html" data-pt="Contacto" data-en="Contact">Contacto</a></li>
      </ul>
    </nav>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="pt">PT</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="nav-toggle" aria-label="Abrir menu">☰</button>
  </header>

  <div class="timeline-page">
    <div class="timeline-header">
      <p class="voltar"><a href="percursos.html" data-pt="&#8592; Percursos" data-en="&#8592; Paths">&#8592; Percursos</a></p>
      <h1 class="timeline-titulo" data-pt="Linha do Tempo" data-en="Timeline">Linha do Tempo</h1>
      <p class="timeline-subtitulo" data-pt="Percorra as épocas da História para explorar as suas enciclopédias." data-en="Browse through the ages of History to explore their encyclopaedias.">Percorra as épocas da História para explorar as suas enciclopédias.</p>
    </div>
    <div class="timeline" id="timeline">
      <!-- Gerado por js/linha-do-tempo.js a partir de js/linha-do-tempo-dados.js -->
    </div>
    <noscript><p style="color:#fff;text-align:center;padding:2rem">Esta página precisa de JavaScript.</p></noscript>
  </div>

  <!-- Painel de outras enciclopédias -->
  <div class="outras-painel" id="outras-painel">
    <button class="outras-painel-close" id="outras-painel-close" aria-label="Fechar">&times;</button>
    <h2 class="outras-painel-titulo" id="outras-painel-titulo"></h2>
    <ul class="outras-painel-lista" id="outras-painel-lista"></ul>
  </div>

  <!-- Carrossel -->
  <div class="carrossel" id="carrossel">
    <button class="carrossel-close" id="carrossel-close" aria-label="Fechar">&times;</button>
    <button class="carrossel-nav carrossel-prev" id="carrossel-prev" aria-label="Anterior">&#8249;</button>
    <img class="carrossel-img" id="carrossel-img" src="" alt="Ficha da obra" />
    <div class="ficha-html" id="ficha-html"></div>
    <button class="carrossel-nav carrossel-next" id="carrossel-next" aria-label="Seguinte">&#8250;</button>
    <div class="carrossel-legenda" id="carrossel-legenda"></div>
    <div class="carrossel-contador" id="carrossel-contador"></div>
  </div>

  <button class="btn-topo" id="btn-topo" aria-label="Voltar ao topo">&#8593;</button>

  <script src="js/script.js"></script>
  <script src="js/enciclopedias-dados.js"></script>
  <script src="js/linha-do-tempo-dados.js"></script>
  <script src="js/carrossel.js"></script>
  <script src="js/linha-do-tempo.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
