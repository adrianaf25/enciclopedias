<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelo Mundo</title>
  <meta name="description" content="Enciclopédias organizadas por continente e local de edição." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/carrossel.css" />
  <link rel="stylesheet" href="css/pelo-mundo.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">Exposição<span>.</span></a>
    <nav>
      <ul>
        <li><a href="index.html" data-pt="Início" data-en="Home">Início</a></li>
        <li><a href="sobre.html" data-pt="Sobre" data-en="About">Sobre</a></li>
        <li><a href="percursos.html" aria-current="page" data-pt="Percursos" data-en="Paths">Percursos</a></li>
        <li><a href="contacto.html" data-pt="Contacto" data-en="Contact">Contacto</a></li>
      </ul>
    </nav>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="pt">PT</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="nav-toggle" aria-label="Abrir menu">☰</button>
  </header>

  <div class="mundo-page">
    <div class="mundo-header">
      <p class="voltar"><a href="percursos.html" data-pt="&#8592; Percursos" data-en="&#8592; Paths">&#8592; Percursos</a></p>
      <h1 class="mundo-titulo" data-pt="Pelo Mundo" data-en="Around the World">Pelo Mundo</h1>
      <p class="mundo-subtitulo" data-pt="Clique num continente para explorar as suas enciclopédias." data-en="Click on a continent to explore its encyclopaedias.">Clique num continente para explorar as suas enciclopédias.</p>
    </div>

    <div class="mapa-container" id="mapa-container">
      <img class="mapa-img" src="assets/images/mapa-mundo.gif" alt="Mapa-mundo" />
      <div class="mapa-overlay"></div>
      <button class="mapa-btn" id="btn-europa" data-continente="europa" style="top:22%;left:48%" data-pt="Europa" data-en="Europe">Europa</button>
      <button class="mapa-btn" id="btn-asia" data-continente="asia" style="top:28%;left:72%" data-pt="Ásia" data-en="Asia">Ásia</button>
      <button class="mapa-btn" id="btn-africa" data-continente="africa" style="top:50%;left:50%" data-pt="África" data-en="Africa">África</button>
      <button class="mapa-btn" id="btn-america-norte" data-continente="america-norte" style="top:28%;left:22%" data-pt="América do Norte" data-en="North America">América do Norte</button>
    </div>

    <!-- Painel do continente selecionado -->
    <div class="continente-painel" id="continente-painel">
      <div class="continente-painel-header">
        <h2 class="continente-painel-titulo" id="continente-painel-titulo"></h2>
        <button class="continente-painel-fechar" id="continente-painel-fechar">&times;</button>
      </div>
      <div class="mundo-paises-lista" id="mundo-botoes"></div>
    </div>
  </div>

  <!-- Painel de outras enciclopédias -->
  <div class="outras-painel" id="outras-painel">
    <button class="outras-painel-close" id="outras-painel-close" aria-label="Fechar">&times;</button>
    <h2 class="outras-painel-titulo" id="outras-painel-titulo"></h2>
    <ul class="outras-painel-lista" id="outras-painel-lista"></ul>
  </div>

  <!-- Carrossel -->
  <div class="carrossel" id="carrossel">
    <button class="carrossel-close" id="carrossel-close" aria-label="Fechar">&times;</button>
    <button class="carrossel-nav carrossel-prev" id="carrossel-prev" aria-label="Anterior">&#8249;</button>
    <img class="carrossel-img" id="carrossel-img" src="" alt="Ficha da obra" />
    <div class="ficha-html" id="ficha-html"></div>
    <button class="carrossel-nav carrossel-next" id="carrossel-next" aria-label="Seguinte">&#8250;</button>
    <div class="carrossel-legenda" id="carrossel-legenda"></div>
    <div class="carrossel-contador" id="carrossel-contador"></div>
  </div>

  <button class="btn-topo" id="btn-topo" aria-label="Voltar ao topo">&#8593;</button>

  <script src="js/script.js"></script>
  <script src="js/enciclopedias-dados.js"></script>
  <script src="js/linha-do-tempo-dados.js"></script>
  <script src="js/carrossel.js"></script>
  <script src="js/pelo-mundo.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
